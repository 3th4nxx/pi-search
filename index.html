<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search for a number in Pi</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Search for a number in Pi:</h1>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Enter numbers...">
            <button id="searchBtn">Search</button>
        </div>
        
        <!-- Display element for search positions -->
        <div id="result"></div>

        <p class="footer-text">Search through the first <strong>1,000,000 digits</strong> of &pi;.</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
